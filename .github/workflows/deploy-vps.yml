# Optional: auto-deploy to a Hostinger VPS on every push to main.
# Only needed for the VPS route. Hostinger Business/Cloud "Node.js Web App" deploys from Git itself.
# Required repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR
name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.ENABLE_VPS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only origin main
            npm ci --omit=dev
            pm2 reload mitolyn-site || pm2 start server.js --name mitolyn-site
            pm2 save
